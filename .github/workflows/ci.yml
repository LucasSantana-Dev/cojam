name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only build/test, so the token needs read-only
# access to repo contents and nothing else.
permissions:
  contents: read

# Rapid pushes to the same branch/PR supersede earlier runs; cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    # Postgres so the persistence tests actually run. Without TEST_DATABASE_URL
    # the migration, store and room-reload tests all t.Skip, which is how
    # internal/db sat at 11% while having tests written for it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cojam
          POSTGRES_DB: cojam_test
          # Trust auth: the container is ephemeral, reachable only from this
          # job, and destroyed with the runner. It also keeps a credential
          # literal out of the repo entirely.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cojam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cojam@localhost:5432/cojam_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keeps the audit at zero so a genuinely exploitable advisory is visible
      # instead of buried under a standing count. Fixes go in the
      # pnpm-workspace.yaml overrides block.
      - run: pnpm audit --audit-level high
      - run: ./scripts/check_web_drift.sh
      # Types + lint are documented local gates (AGENTS.md) and must run in CI:
      # the eslint 10 bump passed this job green while breaking `pnpm lint`.
      - run: pnpm --filter web exec tsc --noEmit
      - run: pnpm --filter web lint
      - run: pnpm --filter web exec vitest run
      - run: pnpm --filter web build

  e2e:
    name: Web e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # playwright.config.ts starts both the web (:3000) and Go (:8080) servers itself.
      - run: pnpm --filter web exec playwright test --reporter=line

name: Uptime

# Runs on GitHub, deliberately not on the CoJam host. The #264 outage went
# unnoticed for ~8h partly because Healthchecks was down for the same root
# cause: a monitor that shares fate with what it monitors is not a monitor.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest
    steps:
      # Two paths, because the proxy routes them to different containers and
      # they fail independently: / reaches the Next app, /api/* the Go server.
      #
      # Do NOT probe /healthz: it is not publicly routed and 404s even when
      # everything is healthy, which yields a permanently red check that gets
      # muted — worse than no check.
      #
      # /api/healthz is the purpose-built liveness probe for the Go server.
      - name: Probe
        env:
          BASE_URL: https://cojam.lucassantana.tech
        run: |
          set -uo pipefail
          fail=0

          probe() {
            path="$1"
            # Three attempts: a single blip should not page anyone.
            for attempt in 1 2 3; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${BASE_URL}${path}" || echo 000)
              if [ "$code" = "200" ]; then
                echo "OK    ${path} -> ${code} (attempt ${attempt})"
                return 0
              fi
              echo "retry ${path} -> ${code} (attempt ${attempt})"
              sleep 10
            done
            echo "FAIL  ${path} -> ${code} after 3 attempts"
            return 1
          }

          probe "/" || fail=1
          probe "/api/healthz" || fail=1

          if [ "$fail" -ne 0 ]; then
            echo "::error::CoJam production is not serving. A 502 here means the container ports and the proxy upstream disagree — see issue #264."
            exit 1
          fi
          echo "Production is serving."

  # A failed scheduled run only sends GitHub's failure email, which is easy to
  # miss (the 2026-11-19 outage ran ~20h). This job keeps one open issue per
  # outage instead: opened on the first failed probe, updated on each further
  # failure, closed on recovery. Issue notifications reach the owner through
  # every channel GitHub has (web, mobile push, email) and the issue doubles as
  # the outage record. It still runs only as often as GitHub's throttled cron.
  alert:
    name: Track outage issue
    needs: probe
    if: always() && (needs.probe.result == 'success' || needs.probe.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.probe.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Open, update or close the outage issue
        run: |
          set -euo pipefail
          now=$(date -u +%Y-%m-%dT%H:%MZ)
          open=$(gh issue list --label outage --state open --json number --jq '.[0].number // empty')

          if [ "$RESULT" = "failure" ]; then
            if [ -z "$open" ]; then
              gh label create outage --color B60205 \
                --description "Production is not serving (opened by the Uptime workflow)" --force >/dev/null
              gh issue create --label outage --assignee "$OWNER" \
                --title "Production down since $now" \
                --body "The Uptime probe failed at $now: \`/\` or \`/api/healthz\` did not return 200 after 3 attempts.

          Run: $RUN_URL

          This issue closes itself when a later probe succeeds. See #264 for the 502 failure mode and docs/specs/268-uptime-probe.md."
            else
              gh issue comment "$open" --body "Still failing at $now. Run: $RUN_URL"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Recovered: probe passed at $now. Run: $RUN_URL"
          fi

# CoJam alerts. Each runbook anchor lives in docs/observability.md.
# File name matches the glob cojam-*.rules.yml loaded by the homelab Prometheus.
# Tests: tests/cojam-alerts.test.yml (promtool test rules).

groups:
  - name: cojam
    rules:
      - alert: CoJamServerDown
        expr: up{job="cojam-server"} == 0
        for: 5m
        labels:
          severity: critical
          service: cojam-server
        annotations:
          summary: "O servidor do CoJam não responde"
          description: "O Prometheus não consegue ler as métricas do cojam-server há 5 minutos. As salas e o login estão fora do ar ou o container caiu."
          runbook: "docs/observability.md#cojamserverdown"

      - alert: CoJamRpcErrors
        expr: |
          (
            sum(rate(music_jam_rpc_duration_seconds_count{job="cojam-server",status="error"}[10m]))
              / sum(rate(music_jam_rpc_duration_seconds_count{job="cojam-server"}[10m]))
          ) > 0.05
          and sum(increase(music_jam_rpc_duration_seconds_count{job="cojam-server",status="error"}[10m])) >= 5
        for: 10m
        labels:
          severity: warning
          service: cojam-server
        annotations:
          summary: "Mais de 5% das ações nas salas estão falhando"
          description: "Mais de 5% das chamadas RPC terminaram em erro do servidor (status=error, não conta erro de uso) por 10 minutos, com pelo menos 5 falhas. Costuma ser banco fora, deploy ruim ou provedor caído."
          runbook: "docs/observability.md#cojamrpcerrors"

      - alert: CoJamDriftHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(music_jam_sync_drift_seconds_bucket{job="cojam-server"}[10m]))) > 5
          and sum(rate(music_jam_sync_drift_samples_total{job="cojam-server"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
          service: cojam-server
        annotations:
          summary: "As pessoas estão ouvindo fora de sincronia"
          description: "O p95 da dessincronia está acima de 5 segundos há 10 minutos, com amostras chegando. Quem ouve junto não está ouvindo a mesma coisa ao mesmo tempo."
          runbook: "docs/observability.md#cojamdrifthigh"

      - alert: CoJamYouTubeQuotaOpen
        expr: max(music_jam_youtube_quota_open{job="cojam-server"}) == 1
        for: 15m
        labels:
          severity: info
          service: cojam-server
        annotations:
          summary: "A cota do YouTube acabou e o freio está aberto"
          description: "O servidor parou de buscar no YouTube há 15 minutos porque a cota foi recusada. Buscas novas falham até a cota voltar (zera às 04:00 de Brasília)."
          runbook: "docs/observability.md#cojamyoutubequotaopen"

      - alert: CoJamEventsDropped
        expr: sum(increase(music_jam_events_dropped_total{job="cojam-server",reason!="disabled"}[15m])) > 0
        labels:
          severity: warning
          service: cojam-server
        annotations:
          summary: "Eventos de produto estão sendo descartados"
          description: "Nos últimos 15 minutos o servidor descartou eventos de produto (buffer cheio ou erro de banco). Os painéis de negócio estão subcontando. O motivo disabled não conta."
          runbook: "docs/observability.md#cojameventsdropped"

      - alert: CoJamPanics
        expr: sum(increase(music_jam_goroutine_panics_total{job="cojam-server"}[10m])) > 0
        labels:
          severity: critical
          service: cojam-server
        annotations:
          summary: "O servidor recuperou um panic em segundo plano"
          description: "Uma rotina em segundo plano deu panic nos últimos 10 minutos. O servidor continuou de pé, mas é bug de código. Veja a linha goroutine_panic nos logs."
          runbook: "docs/observability.md#cojampanics"

      - alert: CoJamPlayingWithoutTransport
        expr: sum(increase(music_jam_room_playing_without_transport_total{job="cojam-server"}[30m])) > 0
        labels:
          severity: warning
          service: cojam-server
        annotations:
          summary: "Sala tocando sem relógio de sincronia"
          description: "Nos últimos 30 minutos o servidor achou sala com música tocando mas sem transporte (relógio de sincronia). É a regressão do #437: a música pode ficar parada no fim ou dessincronizada."
          runbook: "docs/observability.md#cojamplayingwithouttransport"

packages:
  - 'apps/web'
  - 'packages/*'
allowBuilds:
  protobufjs: true
  sharp: true
  unrs-resolver: true
overrides:
  # Force the transitive postcss off <8.5.10 (XSS via unescaped </style> in stringify).
  postcss@<8.5.10: '>=8.5.10'
  # nanoid <3.3.18: infinite loop on zero size (GHSA-2v37-7h3g-55p8). Reached
  # via postcss, so build-time only.
  nanoid@<3.3.18: '>=3.3.18'
  # js-yaml <4.3.1 (GHSA-5p4m-2wfm-xmqj). Reached via eslint, so lint-time only.
  js-yaml@>=4.0.0 <4.3.1: '>=4.3.1'

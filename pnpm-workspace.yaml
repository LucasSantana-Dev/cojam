packages:
  - 'apps/web'
  - 'packages/*'
allowBuilds:
  protobufjs: true
  sharp: true
  unrs-resolver: true
overrides:
  # Force the transitive postcss off <8.5.10 (XSS via unescaped </style> in stringify).
  postcss@<8.5.10: '>=8.5.10'
  # nanoid <3.3.18: infinite loop on zero size (GHSA-2v37-7h3g-55p8). Reached
  # via postcss, so build-time only.
  nanoid@<3.3.18: '>=3.3.18'
  # js-yaml <4.3.1 (GHSA-5p4m-2wfm-xmqj). Reached via eslint, so lint-time only.
  js-yaml@>=4.0.0 <4.3.1: '>=4.3.1'
  # js-yaml 5.x <=5.4.0: maxTotalMergeKeys does not limit CPU use. Reached via
  # eslint>@eslint/eslintrc, so lint-time only. Stays on the 5.x line.
  js-yaml@>=5.0.0 <5.4.1: '>=5.4.1 <6'
  # brace-expansion 1.x <1.1.21: recursion DoS (GHSA-qhr7-859c-m2p7,
  # GHSA-6j4f-fj2g-mc7p) and quadratic expansion. Reached via eslint>minimatch@3,
  # lint-time only. Stays on the 1.x line.
  brace-expansion@<1.1.21: '>=1.1.21 <2'
  # source-map-js <1.2.2: event-loop DoS (GHSA-68fv-2mgg-jv7q). Reached via
  # next>postcss, build-time.
  source-map-js@<1.2.2: '>=1.2.2 <2'
  # sharp <0.35.5: librsvg vulnerability (GHSA-wq5f-xc86-pv6w). Reached via next.
  # Stays on the 0.35 line.
  sharp@<0.35.5: '>=0.35.5 <0.36'
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack exhaustion (GHSA-vfj7-8cjw-p6xm). No patched version
    # exists on npm (latest is 3.0.3), so an override cannot fix it. Reached only via
    # eslint-config-next>@next/eslint-plugin-next>fast-glob>micromatch, lint-time
    # with static patterns, not attacker input. Remove once braces ships a fix.
    - GHSA-vfj7-8cjw-p6xm
